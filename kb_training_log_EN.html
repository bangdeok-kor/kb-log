<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kettlebell Snatch Log — Joohyun / Coach Kseniya</title>
<style>
  :root{
    --ink:#12100E; --ink2:#1B1815; --line:#332E28;
    --amber:#E8A33D; --amber-dim:#8A6320; --paper:#EFE9E0;
    --mute:#8C8378; --ok:#7FB069; --warn:#D9704A;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--sans);
       font-size:15px;line-height:1.5;padding-bottom:96px}
  .wrap{max-width:760px;margin:0 auto;padding:0 14px}
  header{border-bottom:1px solid var(--line);padding:22px 0 16px}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;
           color:var(--amber);margin-bottom:8px}
  h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
  .sub{color:var(--mute);font-size:12.5px;margin-top:6px;font-family:var(--mono)}
  nav{display:flex;gap:6px;position:sticky;top:0;z-index:20;background:var(--ink);
      padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
  nav button{flex:1;background:none;border:1px solid var(--line);color:var(--mute);
    padding:11px 4px;border-radius:2px;font-family:var(--sans);font-size:13px;font-weight:700;
    cursor:pointer;transition:.15s}
  nav button .d{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
    font-weight:400;margin-top:3px;opacity:.75}
  nav button[aria-selected="true"]{background:var(--amber);border-color:var(--amber);color:var(--ink)}
  .place{font-family:var(--mono);font-size:11px;color:var(--mute);margin:-4px 0 14px;
    letter-spacing:.06em;text-transform:uppercase}
  .meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:20px}
  .meta label{display:block;background:var(--ink2);border:1px solid var(--line);padding:9px 11px;border-radius:2px}
  .meta span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--mute);margin-bottom:5px}
  .meta input{width:100%;background:none;border:none;color:var(--paper);font-size:16px;
    font-weight:700;font-family:var(--mono);outline:none;padding:0}
  .block{margin-bottom:26px}
  .bh{display:flex;align-items:baseline;gap:9px;padding-bottom:8px;margin-bottom:10px;
      border-bottom:1px solid var(--line)}
  .bh h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
  .bnote{font-size:12.5px;color:var(--mute);margin:-4px 0 12px;padding-left:10px;
    border-left:2px solid var(--amber-dim)}
  .ex{background:var(--ink2);border:1px solid var(--line);border-radius:3px;
      padding:12px 13px;margin-bottom:8px}
  .ex.note{opacity:.62}
  .ex.done{border-color:var(--amber-dim);background:#1F1A12}
  .top{display:flex;align-items:flex-start;gap:11px}
  .chk{flex:0 0 24px;height:24px;margin-top:1px;border:1.5px solid var(--line);border-radius:2px;
    background:none;cursor:pointer;color:transparent;font-size:14px;font-weight:800;line-height:1;
    display:flex;align-items:center;justify-content:center;transition:.12s}
  .ex.done .chk{background:var(--amber);border-color:var(--amber);color:var(--ink)}
  .nm{flex:1;min-width:0}
  .nm b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
  .vid{display:inline-block;background:var(--warn);color:#fff;font-family:var(--mono);
    font-size:9px;letter-spacing:.1em;padding:2px 5px;border-radius:2px;margin-left:6px;
    vertical-align:2px;font-weight:700}
  .rx{flex:0 0 auto;text-align:right}
  .rx b{display:block;font-family:var(--mono);font-size:13.5px;color:var(--amber);font-weight:700}
  .rest{margin-top:3px;background:none;border:1px solid var(--line);color:var(--mute);
    font-family:var(--mono);font-size:10px;padding:3px 7px;border-radius:2px;cursor:pointer}
  .rest.live{background:var(--amber);color:var(--ink);border-color:var(--amber);font-weight:700}
  .rest.zero{background:var(--ok);color:var(--ink);border-color:var(--ok);font-weight:700}
  .in{display:grid;grid-template-columns:1fr 62px;gap:6px;margin-top:10px}
  .in input{background:var(--ink);border:1px solid var(--line);color:var(--paper);
    padding:9px 10px;border-radius:2px;font-size:14px;font-family:var(--sans);outline:none;width:100%}
  .in input:focus{border-color:var(--amber)}
  .in input::placeholder{color:#5C554C}
  .in input.rpe{text-align:center;font-family:var(--mono);font-weight:700}
  .memo{margin-top:6px}
  .memo input{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--paper);
    padding:8px 10px;border-radius:2px;font-size:13px;outline:none}
  .memo input:focus{border-color:var(--amber)}
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(18,16,14,.96);
    backdrop-filter:blur(8px);border-top:1px solid var(--line);
    padding:11px 14px calc(11px + env(safe-area-inset-bottom));z-index:30}
  .bar .inner{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .prog{flex:1}
  .prog .t{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--mute);margin-bottom:5px}
  .track{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
  .fill{height:100%;background:var(--amber);width:0;transition:width .25s}
  .bar button{background:var(--amber);border:none;color:var(--ink);font-weight:800;font-size:13.5px;
    padding:12px 17px;border-radius:2px;cursor:pointer;white-space:nowrap;font-family:var(--sans)}
  dialog{background:var(--ink2);color:var(--paper);border:1px solid var(--line);border-radius:4px;
    max-width:640px;width:calc(100% - 28px);padding:0}
  dialog::backdrop{background:rgba(0,0,0,.7)}
  .dh{display:flex;justify-content:space-between;align-items:center;padding:15px 17px;
    border-bottom:1px solid var(--line)}
  .dh strong{font-size:15px}
  .dh button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:2px;
    padding:6px 11px;cursor:pointer;font-size:12px}
  .dbody{padding:15px 17px}
  textarea{width:100%;height:46vh;background:var(--ink);border:1px solid var(--line);
    color:var(--paper);font-family:var(--mono);font-size:12px;line-height:1.65;padding:12px;
    border-radius:2px;outline:none;resize:vertical}
  .dact{display:flex;gap:8px;margin-top:11px}
  .dact button{flex:1;background:var(--amber);border:none;color:var(--ink);font-weight:800;
    padding:12px;border-radius:2px;cursor:pointer;font-size:13.5px}
  .dact button.ghost{background:none;border:1px solid var(--line);color:var(--paper);font-weight:600}
  @media(max-width:420px){
    .top{flex-wrap:wrap}
    .rx{width:100%;text-align:left;display:flex;align-items:center;gap:9px;padding-left:35px}
    .rest{margin-top:0}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Coach Kseniya · HMS</div>
    <h1>Kettlebell Snatch — Training Log</h1>
    <div class="sub" id="wk"></div>
  </header>
  <nav id="nav"></nav>
  <div class="place" id="place"></div>
  <div class="meta">
    <label><span>Sleep last night (h)</span><input id="m-sleep" inputmode="decimal" placeholder="6"></label>
    <label><span>Actual duration (min)</span><input id="m-dur" inputmode="numeric" placeholder="90"></label>
    <label><span>Grip condition 1–10</span><input id="m-grip" inputmode="numeric" placeholder="7"></label>
    <label><span>Palm skin 1–10</span><input id="m-palm" inputmode="numeric" placeholder="7"></label>
  </div>
  <div id="days"></div>
</div>
<div class="bar"><div class="inner">
  <div class="prog">
    <div class="t" id="ptext">—</div>
    <div class="track"><div class="fill" id="pfill"></div></div>
  </div>
  <button id="rep">Report</button>
</div></div>
<dialog id="dlg">
  <div class="dh"><strong>Report for Kseniya</strong><button id="close">Close</button></div>
  <div class="dbody">
    <textarea id="out" spellcheck="false"></textarea>
    <div class="dact">
      <button id="copy">Copy all</button>
      <button class="ghost" id="dl">Save .txt</button>
    </div>
  </div>
</dialog>
<script>
const PROGRAM = [{"day": "TUE", "day_ko": "화요일", "date": "8/18", "place": "Himuzip gym", "est": 105, "blocks": [{"name": "Warmup", "note": "", "items": [{"en": "General warmup + special (swing, snatch)", "rx": "12 min", "rest": "-", "type": "note", "video": false}]}, {"name": "Snatch", "note": "Comfortable pace / rest between sets up to 4 min (coach's instruction)", "items": [{"en": "Snatch 16 kg", "rx": "20+20", "rest": "2 min", "type": "set", "video": true}, {"en": "Snatch 20 kg", "rx": "20+20", "rest": "2 min 30 sec", "type": "set", "video": false}, {"en": "Snatch 22 kg", "rx": "15+15", "rest": "3 min", "type": "set", "video": false}, {"en": "Snatch 24 kg", "rx": "15+15", "rest": "3 min", "type": "set", "video": true}, {"en": "Snatch 22 kg", "rx": "15+15", "rest": "before next exercise: 3 min", "type": "set", "video": true}]}, {"name": "Swing", "note": "", "items": [{"en": "Swing 26 kg", "rx": "15+15 × 3 sets", "rest": "between sets 90 sec", "type": "set", "video": false}]}, {"name": "Assistance", "note": "75 sec between sets / 2 min between exercises", "items": [{"en": "Front squat with kettlebell 16 kg", "rx": "20 reps × 3 sets", "rest": "75 sec", "type": "set", "video": false}, {"en": "KB upright row 24-26 kg", "rx": "12 reps × 4 sets", "rest": "75 sec", "type": "set", "video": false}, {"en": "Shrugs 48 kg", "rx": "15 reps × 4 sets", "rest": "75 sec", "type": "set", "video": false}, {"en": "Bent over row 16 kg each arm", "rx": "12 reps × 4 sets", "rest": "75 sec", "type": "set", "video": false}, {"en": "Lunges forward with 20 kg (behind the back)", "rx": "15+15 × 3 sets", "rest": "75 sec", "type": "set", "video": false}]}, {"name": "Finisher", "note": "", "items": [{"en": "ABS, 4 different exercises, 25 reps each, no rest, 1 set", "rx": "1 sets", "rest": "-", "type": "set", "video": false}, {"en": "Mobility exercises a little", "rx": "5 min", "rest": "-", "type": "note", "video": false}]}], "day_name": "Tuesday"}, {"day": "THU", "day_ko": "목요일", "date": "8/20", "place": "Himuzip gym", "est": 90, "blocks": [{"name": "Warmup", "note": "", "items": [{"en": "General warmup + special", "rx": "12 min", "rest": "-", "type": "note", "video": false}]}, {"name": "Snatch", "note": "", "items": [{"en": "Snatch 16 kg, 12 min, 1 switch", "rx": "12 min", "rest": "before next exercise: 4 min", "type": "set", "video": false}]}, {"name": "Swing / Deadlift", "note": "", "items": [{"en": "Swing two hands 22 kg (above your head)", "rx": "20 reps × 3 sets", "rest": "90 sec", "type": "set", "video": false}, {"en": "Deadlift 36 kg", "rx": "5 reps", "rest": "2 min", "type": "set", "video": false}, {"en": "Deadlift 40 kg", "rx": "5 reps", "rest": "2 min", "type": "set", "video": false}, {"en": "Deadlift 60 kg", "rx": "3 reps", "rest": "2 min", "type": "set", "video": false}, {"en": "Deadlift 70-80 kg", "rx": "8 reps × 3 sets", "rest": "2 min", "type": "set", "video": false}]}, {"name": "Dumbbell circuit (2 rounds)", "note": "Weight that allows 15 technically clean reps, but still feel the load / 45 sec between exercises, 2 min between rounds", "items": [{"en": "Lifting dumbbells through the side", "rx": "15 reps × 2R", "rest": "45 sec", "type": "set", "video": false}, {"en": "Triceps extension, inclining down", "rx": "15+15 × 2R", "rest": "45 sec", "type": "set", "video": false}, {"en": "Lifting dumbbells through the side, incline forward", "rx": "15 reps × 2R", "rest": "45 sec", "type": "set", "video": false}, {"en": "Lifting dumbbells up through the side, lying on bench", "rx": "15 reps × 2R", "rest": "45 sec", "type": "set", "video": false}, {"en": "Pullover with dumbbells, lying on bench", "rx": "15 reps × 2R", "rest": "between rounds 2 min", "type": "set", "video": false}]}, {"name": "Finisher", "note": "", "items": [{"en": "Reverse hyperextension", "rx": "15 reps × 3 sets", "rest": "60 sec", "type": "set", "video": false}, {"en": "Plank, 1 max set", "rx": "1 sets max", "rest": "-", "type": "set", "video": false}, {"en": "Mobility exercises a little", "rx": "5 min", "rest": "-", "type": "note", "video": false}]}], "day_name": "Thursday"}, {"day": "SUN", "day_ko": "일요일 새벽", "date": "8/23", "place": "Outdoor park (in front of my house)", "est": 60, "blocks": [{"name": "Warmup", "note": "", "items": [{"en": "General warmup + special", "rx": "10 min", "rest": "-", "type": "note", "video": false}]}, {"name": "GPP circuit (3 rounds)", "note": "No rest between exercises or rounds — only enough time to change exercise, without hurry", "items": [{"en": "Swings + snatch 24 kg", "rx": "10+10 × 3R", "rest": "none", "type": "set", "video": false}, {"en": "Push-ups from the floor", "rx": "15 reps × 3R", "rest": "none", "type": "set", "video": false}, {"en": "Squats with 32 kg in the hang", "rx": "20 reps × 3R", "rest": "none", "type": "set", "video": false}, {"en": "Push-ups from the parallel bar", "rx": "comfortable reps × 3R", "rest": "none", "type": "set", "video": false}, {"en": "Static squats", "rx": "30 sec × 3R", "rest": "none", "type": "set", "video": false}, {"en": "Jump from bench, one leg, switch every rep, stop at lower position", "rx": "15+15 × 3R", "rest": "none", "type": "set", "video": false}, {"en": "Pull-ups", "rx": "comfortable reps × 3R", "rest": "between rounds none", "type": "set", "video": false}]}, {"name": "Finisher", "note": "", "items": [{"en": "Stretching a little", "rx": "8 min", "rest": "-", "type": "note", "video": false}]}], "day_name": "Sunday, early morning"}];
const WEEK = "17-23.08.2026";
const KEY = "kbsnatch:" + WEEK;
let S = {}, cur = 0;
document.getElementById('wk').textContent = "Week " + WEEK + "  \u00b7  3 sessions / snatch + SPP";

/* storage: Claude artifact storage -> localStorage -> memory */
async function load(){
  try{ const r = await window.storage.get(KEY); if(r && r.value){ S = JSON.parse(r.value); return; } }catch(e){}
  try{ const v = localStorage.getItem(KEY); if(v) S = JSON.parse(v); }catch(e){}
}
let saveT;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(async ()=>{
    const v = JSON.stringify(S);
    try{ await window.storage.set(KEY, v); return; }catch(e){}
    try{ localStorage.setItem(KEY, v); }catch(e){}
  }, 400);
}
function g(k,d){ return S[k]===undefined ? d : S[k]; }
function s(k,v){ S[k]=v; save(); }

function secsOf(t){
  let m=0; const mm=t.match(/(\d+)\s*min/), ss=t.match(/(\d+)\s*sec/);
  if(mm) m+=parseInt(mm[1])*60; if(ss) m+=parseInt(ss[1]); return m;
}
let timers={};
function startRest(btn,total,label){
  if(timers[btn.dataset.tid]){ clearInterval(timers[btn.dataset.tid]); delete timers[btn.dataset.tid];
    btn.className='rest'; btn.textContent='rest '+label; return; }
  let left=total; btn.className='rest live';
  const tick=()=>{
    if(left<=0){ clearInterval(timers[btn.dataset.tid]); delete timers[btn.dataset.tid];
      btn.className='rest zero'; btn.textContent='GO';
      if(navigator.vibrate) navigator.vibrate([180,90,180]); return; }
    btn.textContent = Math.floor(left/60)+':'+String(left%60).padStart(2,'0'); left--;
  };
  tick(); timers[btn.dataset.tid]=setInterval(tick,1000);
}

const nav=document.getElementById('nav');
PROGRAM.forEach((d,i)=>{
  const b=document.createElement('button');
  b.innerHTML = d.day + '<span class="d">' + d.date + ' \u00b7 ' + d.est + 'MIN</span>';
  b.onclick=()=>{cur=i;draw();};
  nav.appendChild(b);
});

function esc(v){ return String(v).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function draw(){
  [...nav.children].forEach((b,i)=>b.setAttribute('aria-selected', i===cur));
  const d=PROGRAM[cur];
  document.getElementById('place').textContent = d.day_name + ' \u2014 ' + d.place;
  ['sleep','dur','grip','palm'].forEach(f=>{
    const el=document.getElementById('m-'+f);
    el.value=g(d.day+':'+f,''); el.oninput=()=>s(d.day+':'+f, el.value);
  });
  const host=document.getElementById('days'); host.innerHTML='';
  d.blocks.forEach((blk,bi)=>{
    const sec=document.createElement('section'); sec.className='block';
    sec.innerHTML='<div class="bh"><h2>'+blk.name+'</h2></div>'+
      (blk.note?'<p class="bnote">'+blk.note+'</p>':'');
    blk.items.forEach((it,ii)=>{
      const id=d.day+':'+bi+':'+ii, isNote=it.type==='note', done=g(id+':done',false);
      const div=document.createElement('div');
      div.className='ex'+(isNote?' note':'')+(done?' done':'');
      div.innerHTML='<div class="top"><button class="chk" aria-label="done">\u2713</button>'+
        '<div class="nm"><b>'+it.en+(it.video?'<span class="vid">VIDEO</span>':'')+'</b></div>'+
        '<div class="rx"><b>'+it.rx+'</b></div></div>'+
        (isNote?'':'<div class="in">'+
          '<input class="act" placeholder="actual weight / reps" value="'+esc(g(id+':act',''))+'">'+
          '<input class="rpe" inputmode="numeric" placeholder="RPE" value="'+esc(g(id+':rpe',''))+'"></div>'+
          '<div class="memo"><input class="mm" placeholder="note (pain, feel, technique)" value="'+esc(g(id+':memo',''))+'"></div>');
      div.querySelector('.chk').onclick=()=>{const v=!g(id+':done',false); s(id+':done',v);
        div.classList.toggle('done',v); tally();};
      const rs=secsOf(it.rest);
      if(rs>0){
        const rb=document.createElement('button');
        rb.className='rest'; rb.dataset.tid=id; rb.textContent='rest '+it.rest;
        rb.onclick=()=>startRest(rb,rs,it.rest);
        div.querySelector('.rx').appendChild(rb);
      }
      if(!isNote){
        div.querySelector('.act').oninput=e=>s(id+':act',e.target.value);
        div.querySelector('.rpe').oninput=e=>s(id+':rpe',e.target.value);
        div.querySelector('.mm').oninput=e=>s(id+':memo',e.target.value);
      }
      sec.appendChild(div);
    });
    host.appendChild(sec);
  });
  tally();
}

function tally(){
  const d=PROGRAM[cur]; let tot=0,done=0;
  d.blocks.forEach((b,bi)=>b.items.forEach((it,ii)=>{
    if(it.type==='note') return; tot++;
    if(g(d.day+':'+bi+':'+ii+':done',false)) done++;
  }));
  document.getElementById('ptext').textContent = d.day + ' \u2014 ' + done + ' / ' + tot + ' done';
  document.getElementById('pfill').style.width=(tot?done/tot*100:0)+'%';
}

function report(){
  const L=[];
  L.push('KETTLEBELL TRAINING REPORT');
  L.push('Athlete: Joohyun  |  Week ' + WEEK);
  L.push('='.repeat(46));
  PROGRAM.forEach(d=>{
    let tot=0,done=0;
    d.blocks.forEach((b,bi)=>b.items.forEach((it,ii)=>{
      if(it.type==='note') return; tot++;
      if(g(d.day+':'+bi+':'+ii+':done',false)) done++;
    }));
    L.push(''); L.push(d.day+' '+d.date+'  ('+d.place+')'); L.push('-'.repeat(46));
    const dur=g(d.day+':dur',''), sl=g(d.day+':sleep',''),
          gr=g(d.day+':grip',''), pa=g(d.day+':palm','');
    L.push('Planned '+d.est+' min / Actual '+(dur||'\u2014')+' min   |   Completed '+done+'/'+tot);
    L.push('Sleep '+(sl||'\u2014')+' h  |  Grip '+(gr||'\u2014')+'/10  |  Palm skin '+(pa||'\u2014')+'/10');
    d.blocks.forEach((b,bi)=>{
      const rows=[];
      b.items.forEach((it,ii)=>{
        if(it.type==='note') return;
        const id=d.day+':'+bi+':'+ii;
        const dn=g(id+':done',false), act=g(id+':act',''), rp=g(id+':rpe',''), mo=g(id+':memo','');
        if(!dn && !act && !rp && !mo) return;
        let t='  '+(dn?'[x] ':'[ ] ')+it.en+' \u2014 '+it.rx;
        if(act) t+='  >> '+act;
        if(rp) t+='  (RPE '+rp+')';
        rows.push(t);
        if(mo) rows.push('       note: '+mo);
      });
      if(rows.length){ L.push(''); L.push(' '+b.name.toUpperCase()); rows.forEach(r=>L.push(r)); }
    });
  });
  L.push(''); L.push('='.repeat(46));
  L.push('Comments:'); L.push('  ');
  L.push(''); L.push('Videos:');
  L.push('  Snatch 16 kg \u2014 ');
  L.push('  Snatch 24 kg \u2014 ');
  L.push('  Snatch 22 kg \u2014 ');
  return L.join('\n');
}

const dlg=document.getElementById('dlg'), out=document.getElementById('out');
document.getElementById('rep').onclick=()=>{out.value=report(); dlg.showModal();};
document.getElementById('close').onclick=()=>dlg.close();
document.getElementById('copy').onclick=async()=>{
  const b=document.getElementById('copy');
  try{ await navigator.clipboard.writeText(out.value); }
  catch(e){ out.select(); document.execCommand('copy'); }
  b.textContent='Copied'; setTimeout(()=>b.textContent='Copy all',1600);
};
document.getElementById('dl').onclick=()=>{
  const blob=new Blob([out.value],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='kb_report_'+WEEK.replace(/\./g,'-')+'.txt';
  a.click();
};
